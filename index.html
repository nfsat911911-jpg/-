<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب أحياء ٢ العلاجية | الثانوية ١٤١</title><style>:root{--d:#175b30;--l:#d8f1d4}body{font:17px Tahoma,Arial,sans-serif;background:#eaf5e8;color:#183d25;margin:0}header{background:var(--d);color:white;text-align:center;padding:24px 10px}main{max-width:800px;margin:20px auto;padding:0 15px}.card{background:white;padding:25px;border:2px solid #111;border-radius:15px}button{display:block;width:100%;margin:10px 0;padding:15px;text-align:right;background:var(--l);border:2px solid #111;border-radius:9px;font:inherit;cursor:pointer}button:disabled{opacity:.8}button.ok{background:#a9e6a7}button.no{background:#f1c7c4}.muted{color:#526c58}.feedback{font-weight:bold;padding:12px}a{color:#175b30}footer{text-align:center;margin:25px;padding:18px}h1{font-size:26px}h2{font-size:23px}</style></head><body><header><h1>مختبر الإتقان العلمي | أحياء ٢</h1><p>ألعاب علاج الفاقد - الثانوية ١٤١ - الرياض</p></header><main><div class="card" id="app"></div></main><footer>المعلمة: غزوى البقمي | المديرة: مروه الخريجي</footer><script>const games=[{"title":"شوكيات الجلد واللافقاريات الحبلية","goal":"تمييز خصائص شوكيات الجلد واللافقاريات الحبلية","questions":[["أي صفة تميز شوكيات الجلد البالغة؟",["تماثل شعاعي خماسي","ستة أرجل مفصلية","وجود ريش"],0,"تتميز معظم شوكيات الجلد البالغة بتماثل شعاعي خماسي."],["أي تركيب من خصائص الحبليات؟",["الحبل الظهري","الهيكل الخارجي الكيتيني","الجهاز الوعائي المائي"],0,"الحبل الظهري من الصفات الأساسية للحبليات خلال مرحلة من النمو."]]},{"title":"مخطط العلاقات التصنيفية","goal":"تحديد الأقرب قرابة في مخطط تصنيفي","questions":[["إذا تشاركت مجموعتان في سلف مشترك أحدث، فهما...",["أقرب قرابة","غير مرتبطتين","من مملكتين مختلفتين بالضرورة"],0,"كلما كان السلف المشترك أحدث زادت القرابة التطورية."],["ما وظيفة العقدة في مخطط العلاقات التطورية؟",["تمثيل سلف مشترك","تحديد عدد الأفراد","قياس أحجام الأجسام"],0,"العقدة تمثل نقطة تفرع من سلف مشترك."]]},{"title":"الغدة الدرقية والإندوستايل في الحبليات","goal":"مقارنة الغدة الدرقية بالإندوستايل","questions":[["أي تركيب في بعض الحبليات اللافقارية يرتبط تطوريًا بالغدة الدرقية؟",["الإندوستايل","الزعانف","البلعوم فقط"],0,"الإندوستايل تركيب مرتبط تطوريًا بالغدة الدرقية."],["من وظائف الغدة الدرقية في الفقاريات...",["تنظيم جوانب من الأيض","ضخ الدم","إنتاج حبوب اللقاح"],0,"تؤثر هرمونات الغدة الدرقية في معدلات الأيض والنمو."]]},{"title":"الهرمونات النباتية","goal":"التمييز بين الجبرلينات والسيتوكينينات","questions":[["ما الوظيفة الأشهر للجبرلينات؟",["تنشيط استطالة الساق وإنبات بعض البذور","إغلاق الثغور دائمًا","إنتاج حبوب اللقاح مباشرة"],0,"تشجع الجبرلينات استطالة الساق وبعض عمليات الإنبات."],["أي هرمون يحفز انقسام الخلايا ويؤخر شيخوخة الأوراق؟",["السيتوكينينات","الإيثيلين","الأبسيسيك"],0,"السيتوكينينات تحفز انقسام الخلايا وتساعد على تأخير شيخوخة الأوراق."]]},{"title":"الشرايين والأوردة","goal":"مقارنة اتجاه الدم في الشرايين والأوردة","questions":[["كيف تتحرك الدماء في الشرايين؟",["بعيدًا عن القلب","نحو القلب دائمًا","من الأوردة إلى الشعيرات فقط"],0,"الشرايين تحمل الدم بعيدًا عن القلب."],["أي عبارة صحيحة عادة عن الأوردة؟",["قد تحتوي صمامات تمنع رجوع الدم","جدرها أسمك من كل الشرايين","لا تحمل دمًا إطلاقًا"],0,"توجد صمامات في كثير من الأوردة لتقليل رجوع الدم."]]},{"title":"حجرات القلب ومسار الدم","goal":"تتبع مسار الدم عبر حجرات القلب","questions":[["أي حجرة تضخ الدم إلى الرئتين؟",["البطين الأيمن","الأذين الأيسر","البطين الأيسر"],0,"يدفع البطين الأيمن الدم إلى الشريان الرئوي."],["ما الحجرة التي تستقبل الدم المؤكسج من الأوردة الرئوية؟",["الأذين الأيسر","الأذين الأيمن","البطين الأيمن"],0,"تدخل الأوردة الرئوية إلى الأذين الأيسر."]]},{"title":"تبادل الغازات في الشعيرات","goal":"تفسير الانتشار في تبادل الغازات","questions":[["ما سبب انتقال الأكسجين من الحويصلات للدم؟",["فرق التركيز أو الضغط الجزئي","ضخ مباشر من القلب","انقباض الخلايا الدموية"],0,"ينتقل الأكسجين بالانتشار تبعًا لفروق الضغط الجزئي."],["إلى أين ينتقل ثاني أكسيد الكربون عند الرئتين؟",["من الدم إلى الحويصلات","من الحويصلات إلى الدم دائمًا","إلى العظام"],0,"ينتشر ثاني أكسيد الكربون من الدم إلى الحويصلات ليخرج بالزفير."]]},{"title":"التنفس والتهوية والتنفس الخلوي","goal":"تمييز التهوية عن تبادل الغازات والتنفس الخلوي","questions":[["أي عملية تعني دخول الهواء إلى الرئتين وخروجه؟",["التهوية الرئوية","التنفس الخلوي","التخمر"],0,"التهوية هي حركة الهواء إلى داخل الرئتين وخارجهما."],["أين تنتج معظم جزيئات ATP في التنفس الهوائي؟",["الميتوكوندريا","جدار الخلية","الفجوة العصارية"],0,"تُنتَج معظم الطاقة في الميتوكوندريا بعملية الفسفرة التأكسدية."]]},{"title":"آلية عمل الهرمونات","goal":"تمييز آلية عمل الهرمونات الستيرويدية والببتيدية","questions":[["أين توجد مستقبلات كثير من الهرمونات الستيرويدية؟",["داخل الخلية","فقط على سطح الأجسام الحمراء","في تجويف المعدة"],0,"الهرمونات الستيرويدية تعبر الغشاء وترتبط بمستقبلات داخلية."],["كيف تعمل معظم الهرمونات الببتيدية؟",["ترتبط بمستقبلات على سطح الخلية","تعبر الغشاء دائمًا مباشرة","تعمل دون مستقبلات"],0,"الهرمونات الببتيدية غالبًا لا تعبر الطبقة الدهنية وترتبط بمستقبلات غشائية."]]},{"title":"الطاقة الخلوية والتنفس الخلوي","goal":"تحديد المراحل الأساسية للتنفس الخلوي","questions":[["أين يبدأ التحلل السكري؟",["السيتوسول","النواة","الغشاء البلازمي الخارجي"],0,"يحدث التحلل السكري في السيتوسول."],["ما دور سلسلة نقل الإلكترون في التنفس الهوائي؟",["المساعدة في تكوين تدرج بروتوني لإنتاج ATP","صنع الجلوكوز من ثاني أكسيد الكربون","تضاعف DNA"],0,"تُنشئ سلسلة نقل الإلكترون تدرجًا بروتونيًا يُستخدم لإنتاج ATP."]]}];const root=document.getElementById('app');let gidx=0,qidx=0,score=0,locked=false;function home(){history.replaceState(null,'',location.pathname);root.innerHTML='<h2>اختاري لعبة علاجية</h2><p>عشر ألعاب تعليمية، لكل لعبة أسئلة وتصحيح فوري.</p>'+games.map((g,i)=>'<button onclick="start('+i+')">'+(i+1)+' - '+g.title+'</button>').join('')}function start(i){gidx=i;qidx=0;score=0;locked=false;history.replaceState(null,'','?game='+(i+1));show()}function show(){let g=games[gidx],q=g.questions[qidx];locked=false;root.innerHTML='<p class="muted">اللعبة '+(gidx+1)+' من '+games.length+' | السؤال '+(qidx+1)+' من '+g.questions.length+'</p><h2>'+g.title+'</h2><p><b>الهدف:</b> '+g.goal+'</p><h3>'+q[0]+'</h3>'+q[1].map((a,i)=>'<button id="opt'+i+'" onclick="answer('+i+')">'+a+'</button>').join('')+'<div id="feedback" class="feedback" aria-live="polite"></div><div id="next"></div><p><a href="index.html">العودة إلى الألعاب</a></p>'}function answer(i){if(locked)return;locked=true;let q=games[gidx].questions[qidx];if(i===q[2])score++;q[1].forEach((_,j)=>{let b=document.getElementById('opt'+j);b.disabled=true;if(j===q[2])b.classList.add('ok');else if(j===i)b.classList.add('no')});document.getElementById('feedback').textContent=(i===q[2]?'إجابة صحيحة! ':'راجعي الإجابة الصحيحة. ')+q[3];document.getElementById('next').innerHTML='<button onclick="advance()">'+(qidx+1<games[gidx].questions.length?'السؤال التالي':'عرض النتيجة')+'</button>'}function advance(){qidx++;if(qidx<games[gidx].questions.length)show();else root.innerHTML='<h2>أكملتِ اللعبة!</h2><p>النتيجة: '+score+' من '+games[gidx].questions.length+'</p><p>'+(score===games[gidx].questions.length?'أحسنتِ! أتقنتِ الهدف.':'راجعي التغذية الراجعة وأعيدي المحاولة.')+'</p><button onclick="start('+gidx+')">إعادة المحاولة</button><button onclick="home()">جميع الألعاب</button>'}let n=Number(new URLSearchParams(location.search).get('game'));if(Number.isInteger(n)&&n>=1&&n<=games.length)start(n-1);else home();</script></body></html>
